    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Zero-Flash Pre-Paint Theme Initialization (Supports System / Light / Dark) -->
    <script>
      (function() {
        try {
          var choice = localStorage.getItem('aarogya_theme_choice') || localStorage.getItem('aarogya_theme') || 'system';
          var resolved = 'dark';
          if (choice === 'light') {
            resolved = 'light';
          } else if (choice === 'dark') {
            resolved = 'dark';
          } else {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-choice', choice);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
