services:
  # 1. MongoDB Database Engine (Replica Set Enabled)
  mongo:
    image: mongo:7.0
    container_name: aarogya_mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - aarogya_net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Replica Set Initializer (Runs once to initiate rs0)
  mongo-init:
    image: mongo:7.0
    container_name: aarogya_mongo_init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./deployment/mongo/init-replica.sh:/init-replica.sh:ro
    entrypoint: ["/bin/bash", "/init-replica.sh"]
    networks:
      - aarogya_net

  # 3. Core Backend API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aarogya_server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - LOG_LEVEL=info
      - CLIENT_ORIGIN=https://localhost
      - MONGODB_URI=mongodb://mongo:27017/aarogya_drishti?replicaSet=rs0
      - SIMULATION_MODE=true
      - AGENDA_PROCESS_EVERY=5 seconds
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - server_storage:/app/storage/private_uploads
    networks:
      - aarogya_net

  # 4. Frontend PWA Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: aarogya_client
    restart: unless-stopped
    networks:
      - aarogya_net

  # 5. Nginx TLS Reverse Proxy (Port 80 & 443 with HTTPS redirection)
  reverse-proxy:
    image: nginx:alpine
    container_name: aarogya_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/tls:/etc/nginx/certs:ro
    depends_on:
      - server
      - client
    networks:
      - aarogya_net

volumes:
  mongo_data:
    name: aarogya_mongo_data
  server_storage:
    name: aarogya_server_storage

networks:
  aarogya_net:
    name: aarogya_network
    driver: bridge
